<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720">
  <title>Agora: continue or skip?</title>
  <desc>A research fit discussion: central stage placement, different group formation from Hivemind, shared code lineage, and an untested question about influencing role or stage assignment.</desc>
  <rect width="1280" height="720" fill="#ecece8"/>
  <g font-family="Aptos, Arial, sans-serif">
    <text x="48" y="110" font-size="40" font-weight="bold" fill="#414be1">Agora: continue or skip?</text>
    <text x="48" y="156" font-size="25" fill="#25283b">Does this architecture fit our control-plane study?</text>

    <rect x="48" y="198" width="580" height="150" rx="14" fill="white" stroke="#cdd0de"/>
    <text x="72" y="238" font-size="25" font-weight="bold" fill="#414be1">Stage placement</text>
    <text x="72" y="277" font-size="24" fill="#25283b">Assigned centrally at entry;</text>
    <text x="72" y="309" font-size="24" fill="#25283b">workers stay in their assigned stage.</text>

    <rect x="652" y="198" width="580" height="150" rx="14" fill="white" stroke="#cdd0de"/>
    <text x="676" y="238" font-size="25" font-weight="bold" fill="#414be1">Group formation</text>
    <text x="676" y="277" font-size="24" fill="#25283b">Rosters rebuilt each averaging round;</text>
    <text x="676" y="309" font-size="24" fill="#25283b">no Hivemind-style leader election.</text>

    <rect x="48" y="368" width="580" height="150" rx="14" fill="white" stroke="#cdd0de"/>
    <text x="72" y="408" font-size="25" font-weight="bold" fill="#414be1">Hivemind lineage</text>
    <text x="72" y="447" font-size="24" fill="#25283b">Shared foundations, with different</text>
    <text x="72" y="479" font-size="24" fill="#25283b">coordination and trust assumptions.</text>

    <rect x="652" y="368" width="580" height="150" rx="14" fill="white" stroke="#cdd0de"/>
    <text x="676" y="408" font-size="25" font-weight="bold" fill="#414be1">Possible research angle</text>
    <text x="676" y="447" font-size="24" fill="#25283b">Can a peer influence its stage or</text>
    <text x="676" y="479" font-size="24" fill="#25283b">trainer/worker assignment? Untested.</text>

    <rect x="48" y="543" width="580" height="67" rx="6" fill="#414be1"/>
    <text x="72" y="585" font-size="24" font-weight="bold" fill="white">Continue: assess Agora as a comparison case</text>
    <rect x="652" y="543" width="580" height="67" rx="6" fill="#deddd5"/>
    <text x="676" y="585" font-size="24" font-weight="bold" fill="#25283b">Skip: save time for the main study</text>
    <text x="58" y="650" font-size="13" fill="#646b7f">Sources: Agora paper §§3.3.1, 3.6.1; pinned matchmaking implementation. Research question is untested.</text>
  </g>
  <image x="0" y="672" width="1280" height="48" xlink:href="footer.png"/>
</svg>
