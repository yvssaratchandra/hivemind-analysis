[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trainsim"
version = "0.1.0"
description = "Reproducible coordination simulation for decentralized training research"
requires-python = ">=3.11,<3.12"
dependencies = ["simpy==4.1.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
trainsim = "trainsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
